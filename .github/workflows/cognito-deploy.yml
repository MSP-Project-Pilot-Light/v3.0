name: "Cognito Infrastructure Deploy (Test)"

on:
  push:
    branches:
      - cognito
    paths:
      - 'v3.0/terraform/cognito/**'
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 작업'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

# TODO: Production 전환 시 워크플로우 파일 분리
# - cognito-deploy-global.yml (DynamoDB Global Table)
# - cognito-deploy-seoul.yml (Seoul Cognito)
# - cognito-deploy-tokyo.yml (Tokyo Cognito)
# 이유: 의존성 순서 보장 (Global → Seoul → Tokyo)

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Cognito Terraform ${{ github.event.inputs.action || 'plan' }}"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      
      # Global 배포
      - name: Terraform Init (Global)
        working-directory: ./v3.0/terraform/cognito/global
        run: terraform init

      - name: Terraform Action (Global)
        working-directory: ./v3.0/terraform/cognito/global
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve
          elif [ "${{ github.event.inputs.action }}" == "apply" ] || [ "${{ github.event_name }}" == "push" ]; then
            terraform apply -auto-approve
          else
            terraform plan
          fi
      
      # Seoul 배포
      - name: Terraform Init (Seoul)
        working-directory: ./v3.0/terraform/cognito/seoul
        run: terraform init

      - name: Terraform Action (Seoul)
        working-directory: ./v3.0/terraform/cognito/seoul
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve
          elif [ "${{ github.event.inputs.action }}" == "apply" ] || [ "${{ github.event_name }}" == "push" ]; then
            terraform apply -auto-approve
          else
            terraform plan
          fi
      
      # Tokyo 배포
      - name: Terraform Init (Tokyo)
        working-directory: ./v3.0/terraform/cognito/tokyo
        run: terraform init

      - name: Terraform Action (Tokyo)
        working-directory: ./v3.0/terraform/cognito/tokyo
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve
          elif [ "${{ github.event.inputs.action }}" == "apply" ] || [ "${{ github.event_name }}" == "push" ]; then
            terraform apply -auto-approve
          else
            terraform plan
          fi
